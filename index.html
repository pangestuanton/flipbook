<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flipbook Modul Ajar: Menulis Teks Legenda</title>
<meta name="description" content="Flipbook interaktif Modul Ajar Bahasa Indonesia SMP Kelas IX: Menulis Teks Legenda dengan Kosakata Denotatif, Konotatif, dan Kiasan.">
<meta name="theme-color" content="#CA8289">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23CA8289'/%3E%3Cpath d='M14 18c6-3 12-3 18 0 6-3 12-3 18 0v30c-6-3-12-3-18 0-6-3-12-3-18 0z' fill='%23FFF4EC'/%3E%3Cpath d='M32 18v30' stroke='%23CA8289' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/book.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__book">
    <span class="loader__page"></span>
    <span class="loader__page"></span>
    <span class="loader__page"></span>
    <span class="loader__cover"></span>
  </div>
  <p class="loader__text">Menyiapkan buku</p>
  <div class="loader__bar"><span id="loaderBar"></span></div>
</div>

<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar__brand">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.2 9 4.2 11.2 5.6v13c-2.2-1.4-4.7-1.4-7.2-.3zM20 5.5c-2.5-1.3-5-1.3-7.2.1v13c2.2-1.4 4.7-1.4 7.2-.3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <div class="topbar__titles">
        <strong>Menulis Teks Legenda</strong>
        <span>Bahasa Indonesia SMP Kelas IX</span>
      </div>
    </div>
    <div class="topbar__progress" role="progressbar" aria-label="Progres membaca" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressWrap">
      <div class="topbar__track"><span class="topbar__fill" id="progressFill"></span></div>
      <span class="topbar__pct" id="progressPct">0%</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="book-wrap" id="bookWrap">
      <div class="book" id="book" aria-label="Flipbook modul ajar">
        <div class="book__base book__base--left" aria-hidden="true">
          <div class="base-inner">
            <svg viewBox="0 0 120 120" class="base-emblem"><use href="#emblemRose"></use></svg>
          </div>
        </div>
        <div class="book__base book__base--right" aria-hidden="true">
          <div class="base-inner">
            <p class="base-finish">Tamat</p>
            <p class="base-finishsub">Terima kasih telah membaca</p>
          </div>
        </div>
        <div class="leafstack" id="leafstack"></div>
        <div class="book__spine" aria-hidden="true"></div>
      </div>
      <button class="closed-hint" id="closedHint" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        Buka buku
      </button>
    </div>
  </main>

  <nav class="toolbar" aria-label="Navigasi flipbook">
    <button class="tbtn" id="btnPrev" aria-label="Halaman sebelumnya"></button>
    <span class="pagefield"><input id="pageInput" type="number" min="1" max="17" value="1" aria-label="Nomor halaman"><span>/ 17</span></span>
    <button class="tbtn" id="btnNext" aria-label="Halaman berikutnya"></button>
    <span class="toolbar__sep" aria-hidden="true"></span>
    <button class="tbtn" id="btnToc" aria-label="Buka daftar isi" aria-expanded="false"></button>
    <button class="tbtn" id="btnMark" aria-label="Tandai halaman ini"></button>
    <button class="tbtn" id="btnQuiz" aria-label="Buka kuis"></button>
    <button class="tbtn" id="btnSound" aria-label="Suara halaman" aria-pressed="false"></button>
    <button class="tbtn" id="btnFull" aria-label="Mode layar penuh"></button>
  </nav>
</div>

<!-- Scrim + drawer daftar isi -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Daftar isi dan tanda halaman">
  <div class="drawer__head">
    <h2>Daftar Isi</h2>
    <button class="drawer__close" id="drawerClose" aria-label="Tutup daftar isi"></button>
  </div>
  <div class="drawer__body" id="drawerBody"></div>
  <div class="drawer__foot">
    <p class="small">Tanda halaman dan progres tersimpan otomatis di perangkat ini.</p>
  </div>
</aside>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau gambar">
  <div class="lightbox__frame">
    <button class="lightbox__close" id="lbClose" aria-label="Tutup pratinjau"></button>
    <img class="lightbox__img" id="lbImg" alt="Pratinjau ilustrasi">
    <p class="lightbox__cap" id="lbCap"></p>
  </div>
</div>

<!-- Quiz center -->
<div class="quizcenter" id="quizcenter" role="dialog" aria-modal="true" aria-label="Kuis pemahaman">
  <div class="quizcenter__panel">
    <div class="quizcenter__head">
      <h2>Uji Pemahaman</h2>
      <button class="drawer__close" id="qcClose" aria-label="Tutup kuis"></button>
    </div>
    <div id="qcBody"></div>
  </div>
</div>

<!-- Shared SVG defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="emblemRose" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#FFF4EC" stroke-width="2.5" opacity="0.7"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#FFF4EC" stroke-width="1.2" opacity="0.4"/>
      <path d="M38 46c7-4 14-4 20 0 6-4 13-4 20 0v30c-7-4-14-4-20 0-6-4-13-4-20 0z" fill="none" stroke="#FFF4EC" stroke-width="3" stroke-linejoin="round"/>
      <path d="M58 46v30" stroke="#FFF4EC" stroke-width="2"/>
      <path d="M60 26l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FBD1A0"/>
    </symbol>
  </defs>
</svg>

<script src="js/icons.js"></script>
<script src="js/content.js"></script>
<script src="js/flip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
